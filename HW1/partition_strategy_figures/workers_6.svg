uite inițial</text><rect x="18" y="60" width="404" height="6.3125" fill="#70b7ed" stroke="#ffffff" stroke-width="0.65"/><rect x="18" y="66.3125" width="404" height="6.3125" fill="#f3ac77" stroke="#ffffff" stroke-width="0.65"/><rect x="18" y="72.625" width="404" height="6.3125" fill="#93ca95" stroke="#ffffff" stroke-width="0.65"/><rect x="18" y="78.9375" width="404" height="6.3125" fill="#c3a2df" stroke="#ffffff" stroke-width="0.65"/><rect x="18" y="85.25" width="404" height="6.3125" fill="#f1c75b" stroke="#ffffff" stroke-width="0.65"/><rect x="18" y="91.5625" width="404" height="6.3125" fill="#78cecb" stroke="#ffffff" stroke-width="0.65"/><rect x="18" y="97.875" width="404" height="6.3125" fill="#e4e8ed" stroke="#ffffff" stroke-width="0.65"/><rect x="18" y="104.1875" width="404" height="6.3125" fill="#e4e8ed" stroke="#ffffff" stroke-width="0.65"/><rect x="18" y="110.5" width="404" height="6.3125" fill="#e4e8ed" stroke="#ffffff" stroke-width="0.65"/><rect x="18" y="116.8125" width="404" height="6.3125" fill="#e4e8ed" stroke="#ffffff" stroke-width="0.65"/><rect x="18" y="123.125" width="404" height="6.3125" fill="#e4e8ed" stroke="#ffffff" stroke-width="0.65"/><rect x="18" y="129.4375" width="404" height="6.3125" fill="#e4e8ed" stroke="#ffffff" stroke-width="0.65"/><rect x="18" y="135.75" width="404" height="6.3125" fill="#e4e8ed" stroke="#ffffff" stroke-width="0.65"/><rect x="18" y="142.0625" width="404" height="6.3125" fill="#e4e8ed" stroke="#ffffff" stroke-width="0.65"/><rect x="18" y="148.375" width="404" height="6.3125" fill="#e4e8ed" stroke="#ffffff" stroke-width="0.65"/><rect x="18" y="154.6875" width="404" height="6.3125" fill="#e4e8ed" stroke="#ffffff" stroke-width="0.65"/><rect x="18" y="161" width="404" height="6.3125" fill="#e4e8ed" stroke="#ffffff" stroke-width="0.65"/><rect x="18" y="167.3125" width="404" height="6.3125" fill="#e4e8ed" stroke="#ffffff" stroke-width="0.65"/><rect x="18" y="173.625" width="404" height="6.3125" fill="#e4e8ed" stroke="#ffffff