<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 370" role="img" aria-labelledby="title"><title id="title">Distribuirea imaginii pentru 6 workeri</title><rect width="1340" height="370" fill="white"/><g font-family="Arial, sans-serif" fill="#182536"><g transform="translate(0 0)"><text x="18" y="25" font-size="21" font-weight="700">static_1d</text><text x="18" y="46" font-size="14" fill="#475569">6 benzi, o sarcină per worker</text><rect x="18" y="60" width="404" height="37.875" fill="#70b7ed" stroke="#ffffff" stroke-width="1.4"/><text x="220" y="78.9375" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="600">W1</text><rect x="18" y="97.875" width="404" height="37.875" fill="#f3ac77" stroke="#ffffff" stroke-width="1.4"/><text x="220" y="116.8125" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="600">W2</text><rect x="18" y="135.75" width="404" height="37.875" fill="#93ca95" stroke="#ffffff" stroke-width="1.4"/><text x="220" y="154.6875" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="600">W3</text><rect x="18" y="173.625" width="404" height="37.875" fill="#c3a2df" stroke="#ffffff" stroke-width="1.4"/><text x="220" y="192.5625" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="600">W4</text><rect x="18" y="211.5" width="404" height="37.875" fill="#f1c75b" stroke="#ffffff" stroke-width="1.4"/><text x="220" y="230.4375" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="600">W5</text><rect x="18" y="249.375" width="404" height="37.875" fill="#78cecb" stroke="#ffffff" stroke-width="1.4"/><text x="220" y="268.3125" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="600">W6</text><rect x="18" y="60" width="404" height="227.25" fill="none" stroke="#64748b"/><text x="18" y="310" font-size="13" fill="#475569">W1 primește banda de sus; WP, banda de jos.</text><text x="18" y="331" font-size="13" fill="#475569"