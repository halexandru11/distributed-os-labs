<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 370" role="img" aria-labelledby="title"><title id="title">Distribuirea imaginii pentru 2 workeri</title><rect width="1340" height="370" fill="white"/><g font-family="Arial, sans-serif" fill="#182536"><g transform="translate(0 0)"><text x="18" y="25" font-size="21" font-weight="700">static_1d</text><text x="18" y="46" font-size="14" fill="#475569">2 benzi, o sarcină per worker</text><rect x="18" y="60" width="404" height="113.625" fill="#70b7ed" stroke="#ffffff" stroke-width="1.4"/><text x="220" y="116.8125" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="600">W1</text><rect x="18" y="173.625" width="404" height="113.625" fill="#f3ac77" stroke="#ffffff" stroke-width="1.4"/><text x="220" y="230.4375" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="600">W2</text><rect x="18" y="60" width="404" height="227.25" fill="none" stroke="#64748b"/><text x="18" y="310" font-size="13" fill="#475569">W1 primește banda de sus; WP, banda de jos.</text><text x="18" y="331" font-size="13" fill="#475569">Sarcinile sunt fixate înainte de calcul.</text></g><g transform="translate(450 0)"><text x="18" y="25" font-size="21" font-weight="700">static_2d</text><text x="18" y="46" font-size="14" fill="#475569">1 coloane × 2 rânduri</text><rect x="18" y="60" width="404" height="113.625" fill="#70b7ed" stroke="#ffffff" stroke-width="1.4"/><text x="220" y="116.8125" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="600">W1</text><rect x="18" y="173.625" width="404" height="113.625" fill="#f3ac77" stroke="#ffffff" stroke-width="1.4"/><text x="220" y="230.4375" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="600">W2</text><rect x="18" y="60" width="404" height="227.25" fill="none" stroke="#64748b"/><text x="18" y="310" font-size="13" fill="#475569">Workerii sunt numerotați pe rânduri, de sus în jos.</text><text x="18" y="331" font-size="13" fill="#475569">Sarcinile sunt fixate înainte de calcul.</text></g><g transform="translate(900 0)"><text x="18" y="25" font-size="21" font-weight="700">dynamic_1d</text><text x="18" y="46" font-size="14" fill="#475569">12 benzi, 2 atribuite inițial</text><rect x="18" y="60" width="404" height="18.9375" fill="#70b7ed" stroke="#ffffff" stroke-width="0.65"/><rect x="18" y="78.9375" width="404" height="18.9375" fill="#f3ac77" stroke="#ffffff" stroke-width="0.65"/><rect x="18" y="97.875" width="404" height="18.9375" fill="#e4e8ed" stroke="#ffffff" stroke-width="0.65"/><rect x="18" y="116.8125" width="404" height="18.9375" fill="#e4e8ed" stroke="#ffffff" stroke-width="0.65"/><rect x="18" y="135.75" width="404" height="18.9375" fill="#e4e8ed" stroke="#ffffff" stroke-width="0.65"/><rect x="18" y="154.6875" width="404" height="18.9375" fill="#e4e8ed" stroke="#ffffff" stroke-width="0.65"/><rect x="18" y="173.625" width="404" height="18.9375" fill="#e4e8ed" stroke="#ffffff" stroke-width="0.65"/><rect x="18" y="192.5625" width="404" height="18.9375" fill="#e4e8ed" stroke="#ffffff" stroke-width="0.65"/><rect x="18" y="211.5" width="404" height="18.9375" fill="#e4e8ed" stroke="#ffffff" stroke-width="0.65"/><rect x="18" y="230.4375" width="404" height="18.9375" fill="#e4e8ed" stroke="#ffffff" stroke-width="0.65"/><rect x="18" y="249.375" width="404" height="18.9375" fill="#e4e8ed" stroke="#ffffff" stroke-width="0.65"/><rect x="18" y="268.3125" width="404" height="18.9375" fill="#e4e8ed" stroke="#ffffff" stroke-width="0.65"/><rect x="18" y="60" width="404" height="227.25" fill="none" stroke="#64748b"/><text x="18" y="310" font-size="13" fill="#475569">Culori: primele sarcini, T1 → W1 … TP → WP.</text><text x="18" y="331" font-size="13" fill="#475569">Gri: sarcini încă neatribuite.</text><text x="18" y="352" font-size="13" fill="#475569">La finalizare, workerul primește următoarea sarcină.</text></g></g></svg>