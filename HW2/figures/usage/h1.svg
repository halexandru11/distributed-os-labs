<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900" role="img">
<title>H1 hybrid_ij_k — cell and product ownership</title>
<desc>One outer team divides (i,j) cells; a child k-team computes each cell’s dot product. Colors and thread labels identify owners; the small strip in each output cell lists k-product owners left to right. Dynamic and guided allocation is illustrative.</desc>
