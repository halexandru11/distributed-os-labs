<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900" role="img">
<title>H2 hybrid_i_jk — cell and product ownership</title>
<desc>Outer workers own rows. Each row gets a child team sharing its flattened (j,k) products. Colors and thread labels identify owners; the small strip in each output cell lists k-product owners left to right. Dynamic and guided allocation is illustrative.</desc>
