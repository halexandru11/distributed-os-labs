<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900" role="img">
<title>N2 nested_ik — cell and product ownership</title>
<desc>Each row worker visits j sequentially and creates a k-team for each cell. Colors and thread labels identify owners; the small strip in each output cell lists k-product owners left to right. Dynamic and guided allocation is illustrative.</desc>
<rect width="1000" height="900" rx="14" fill="#fff"/>
<text x="28" y="37" font-family="system-ui, sans-serif" font-size="24" fill="#17243a" font-weight="600" text-anchor="start">N2 · nested_ik</text>
<text x="28" y="65" font-family="system-ui, sans-serif" font-size="16" fill="#607086" font-weight="400" text-anchor="start">Fixed assignment for these static chunks</text>
<text x="28" y="105" font-family="system-ui, sans-serif" font-size="20" fill="#17243a" font-weight="600" text-anchor="start">C: rows i, columns j</text>
<text x="28" y="130" font-family="system-ui, sans-serif" font-size="16" fill="#607086" font-weight="400" text-anchor="start">All values = 4. Each colored strip = k0 → k3.</text>
<text x="139.0" y="162" font-family="system-ui, sans-serif" font-size="15" fill="#17243a" font-weight="400" text-anchor="middle">j=0</text>
<text x="235.0" y="162" font-family="system-ui, sans-serif" font-size="15" fill="#17243a" font-weight="400" text-anchor="middle">j=1</text>
<text x="30" y="201" font-family="system-ui, sans-serif" font-size="15" fill="#17243a" font-weight="400" text-anchor="start">i=0</text>
<rect x="90" y="174" width="88" height="61" rx="7" fill="#f1f5f9" stroke="#17243a" stroke-width="2"/>
<text x="134.0" y="199" font-family="system-ui, sans-serif" font-size="21" fill="#17243a" font-weight="600" text-anchor="middle">4</text>
<text x="134.0" y="217" font-family="system-ui, sans-serif" font-size="16" fill="#17243a" font-weight="400" text-anchor="middle">2 threads</text>
<rect x="94.0" y="224" width="19.0" height="7" rx="1" fill="#2563eb"/>
<rect x="114.0" y="224" width="19.0" height="7" rx="1" fill="#c2410c"/>
<rect x="134.0" y="224" width="19.0" height="7" rx="1" fill="#2563eb"/>
<rect x="154.0" y="224" width="19.0" height="7" rx="1" fill="#c2410c"/>
<rect x="186" y="174" width="88" height="61" rx="7" fill="#f1f5f9"/>
<text x="230.0" y="199" font-family="system-ui, sans-serif" font-size="21" fill="#17243a" font-weight="600" text-anchor="middle">4</text>
<text x="230.0" y="217" font-family="system-ui, sans-serif" font-size="16" fill="#17243a" font-weight="400" text-anchor="middle">2 threads</text>
<rect x="190.0" y="224" width="19.0" height="7" rx="1" fill="#2563eb"/>
<rect x="210.0" y="224" width="19.0" height="7" rx="1" fill="#c2410c"/>
<rect x="230.0" y="224" width="19.0" height="7" rx="1" fill="#2563eb"/>
<rect x="250.0" y="224" width="19.0" height="7" rx="1" fill="#c2410c"/>
<text x="30" y="271" font-family="system-ui, sans-serif" font-size="15" fill="#17243a" font-weight="400" text-anchor="start">i=1</text>
<rect x="90" y="244" width="88" height="61" rx="7" fill="#f1f5f9"/>
<text x="134.0" y="269" font-family="system-ui, sans-serif" font-size="21" fill="#17243a" font-weight="600" text-anchor="middle">4</text>
<text x="134.0" y="287" font-family="system-ui, sans-serif" font-size="16" fill="#17243a" font-weight="400" text-anchor="middle">2 threads</text>
<rect x="94.0" y="294" width="19.0" height="7" rx="1" fill="#0f766e"/>
<rect x="114.0" y="294" width="19.0" height="7" rx="1" fill="#9333ea"/>
<rect x="134.0" y="294" width="19.0" height="7" rx="1" fill="#0f766e"/>
<rect x="154.0" y="294" width="19.0" height="7" rx="1" fill="#9333ea"/>
<rect x="186" y="244" width="88" height="61" rx="7" fill="#f1f5f9"/>
<text x="230.0" y="269" font-family="system-ui, sans-serif" font-size="21" fill="#17243a" font-weight="600" text-anchor="middle">4</text>
<text x="230.0" y="287" font-family="system-ui, sans-serif" font-size="16" fill="#17243a" font-weight="400" text-anchor="middle">2 threads</text>
<rect x="190.0" y="294" width="19.0" height="7" rx="1" fill="#0f766e"/>
<rect x="210.0" y="294" width="19.0" height="7" rx="1" fill="#9333ea"/>
<rect x="230.0" y="294" width="19.0" height="7" rx="1" fill="#0f766e"/>
<rect x="250.0" y="294" width="19.0" height="7" rx="1" fill="#9333ea"/>
<text x="536" y="105" font-family="system-ui, sans-serif" font-size="20" fill="#17243a" font-weight="600" text-anchor="start">Inside C[0,0]</text>
<text x="536" y="130" font-family="system-ui, sans-serif" font-size="16" fill="#607086" font-weight="400" text-anchor="start">One tile = one A[0,k] × B[k,0] product</text>
<rect x="536" y="151" width="202" height="90" rx="7" fill="#dbeafe"/>
<rect x="536" y="151" width="202" height="5" rx="0" fill="#2563eb"/>
<text x="548" y="178" font-family="system-ui, sans-serif" font-size="15" fill="#17243a" font-weight="400" text-anchor="start">k=0</text>
<text x="548" y="203" font-family="system-ui, sans-serif" font-size="16" fill="#17243a" font-weight="400" text-anchor="start">1 × 1 = 1</text>
<text x="548" y="226" font-family="system-ui, sans-serif" font-size="16" fill="#2563eb" font-weight="600" text-anchor="start">T0.0</text>
<rect x="746" y="151" width="202" height="90" rx="7" fill="#ffedd5"/>
<rect x="746" y="151" width="202" height="5" rx="0" fill="#c2410c"/>
<text x="758" y="178" font-family="system-ui, sans-serif" font-size="15" fill="#17243a" font-weight="400" text-anchor="start">k=1</text>
<text x="758" y="203" font-family="system-ui, sans-serif" font-size="16" fill="#17243a" font-weight="400" text-anchor="start">1 × 1 = 1</text>
<text x="758" y="226" font-family="system-ui, sans-serif" font-size="16" fill="#c2410c" font-weight="600" text-anchor="start">T0.1</text>
<rect x="536" y="249" width="202" height="90" rx="7" fill="#dbeafe"/>
<rect x="536" y="249" width="202" height="5" rx="0" fill="#2563eb"/>
<text x="548" y="276" font-family="system-ui, sans-serif" font-size="15" fill="#17243a" font-weight="400" text-anchor="start">k=2</text>
<text x="548" y="301" font-family="system-ui, sans-serif" font-size="16" fill="#17243a" font-weight="400" text-anchor="start">1 × 1 = 1</text>
<text x="548" y="324" font-family="system-ui, sans-serif" font-size="16" fill="#2563eb" font-weight="600" text-anchor="start">T0.0</text>
<rect x="746" y="249" width="202" height="90" rx="7" fill="#ffedd5"/>
<rect x="746" y="249" width="202" height="5" rx="0" fill="#c2410c"/>
<text x="758" y="276" font-family="system-ui, sans-serif" font-size="15" fill="#17243a" font-weight="400" text-anchor="start">k=3</text>
<text x="758" y="301" font-family="system-ui, sans-serif" font-size="16" fill="#17243a" font-weight="400" text-anchor="start">1 × 1 = 1</text>
<text x="758" y="324" font-family="system-ui, sans-serif" font-size="16" fill="#c2410c" font-weight="600" text-anchor="start">T0.1</text>
<text x="536" y="372" font-family="system-ui, sans-serif" font-size="16" fill="#17243a" font-weight="400" text-anchor="start">T0.0: 2 + T0.1: 2</text>
<text x="536" y="399" font-family="system-ui, sans-serif" font-size="16" fill="#17243a" font-weight="400" text-anchor="start">Private sums → reduction (+) → C[0,0] = 4</text>
<defs><marker id="arrow-N2" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#9aa9bd"/></marker></defs>
<text x="28" y="457" font-family="system-ui, sans-serif" font-size="21" fill="#17243a" font-weight="600" text-anchor="start">Follow the branching teams</text>
<rect x="380" y="478" width="240" height="58" rx="7" fill="#f1f5f9"/>
<text x="500.0" y="502" font-family="system-ui, sans-serif" font-size="17" fill="#17243a" font-weight="600" text-anchor="middle">i-team: 2 workers</text>
<line x1="500" y1="536" x2="260" y2="552" stroke="#9aa9bd" stroke-width="1.5" marker-end="url(#arrow-N2)"/>
<rect x="150" y="554" width="220" height="58" rx="7" fill="#f1f5f9"/>
<text x="260.0" y="578" font-family="system-ui, sans-serif" font-size="17" fill="#17243a" font-weight="600" text-anchor="middle">T0 · i=0</text>
<text x="260.0" y="601" font-family="system-ui, sans-serif" font-size="16" fill="#17243a" font-weight="400" text-anchor="middle">j=0 then j=1</text>
<line x1="500" y1="536" x2="740" y2="552" stroke="#9aa9bd" stroke-width="1.5" marker-end="url(#arrow-N2)"/>
<rect x="630" y="554" width="220" height="58" rx="7" fill="#f1f5f9"/>
<text x="740.0" y="578" font-family="system-ui, sans-serif" font-size="17" fill="#17243a" font-weight="600" text-anchor="middle">T1 · i=1</text>
<text x="740.0" y="601" font-family="system-ui, sans-serif" font-size="16" fill="#17243a" font-weight="400" text-anchor="middle">j=0 then j=1</text>
<line x1="260" y1="612" x2="138" y2="630" stroke="#9aa9bd" stroke-width="1.5" marker-end="url(#arrow-N2)"/>
<rect x="28" y="633" width="220" height="58" rx="7" fill="#dbeafe"/>
<rect x="28" y="633" width="4" height="58" rx="0" fill="#2563eb"/>
<text x="138.0" y="657" font-family="system-ui, sans-serif" font-size="17" fill="#17243a" font-weight="600" text-anchor="middle">T0.0 · k=0,2</text>
<text x="138.0" y="680" font-family="system-ui, sans-serif" font-size="16" fill="#17243a" font-weight="400" text-anchor="middle">private sum = 2</text>
<line x1="260" y1="612" x2="378" y2="630" stroke="#9aa9bd" stroke-width="1.5" marker-end="url(#arrow-N2)"/>
<rect x="268" y="633" width="220" height="58" rx="7" fill="#ffedd5"/>
<rect x="268" y="633" width="4" height="58" rx="0" fill="#c2410c"/>
<text x="378.0" y="657" font-family="system-ui, sans-serif" font-size="17" fill="#17243a" font-weight="600" text-anchor="middle">T0.1 · k=1,3</text>
<text x="378.0" y="680" font-family="system-ui, sans-serif" font-size="16" fill="#17243a" font-weight="400" text-anchor="middle">private sum = 2</text>
<line x1="740" y1="612" x2="618" y2="630" stroke="#9aa9bd" stroke-width="1.5" marker-end="url(#arrow-N2)"/>
<rect x="508" y="633" width="220" height="58" rx="7" fill="#ccfbf1"/>
<rect x="508" y="633" width="4" height="58" rx="0" fill="#0f766e"/>
<text x="618.0" y="657" font-family="system-ui, sans-serif" font-size="17" fill="#17243a" font-weight="600" text-anchor="middle">T1.0 · k=0,2</text>
<text x="618.0" y="680" font-family="system-ui, sans-serif" font-size="16" fill="#17243a" font-weight="400" text-anchor="middle">private sum = 2</text>
<line x1="740" y1="612" x2="858" y2="630" stroke="#9aa9bd" stroke-width="1.5" marker-end="url(#arrow-N2)"/>
<rect x="748" y="633" width="220" height="58" rx="7" fill="#f3e8ff"/>
<rect x="748" y="633" width="4" height="58" rx="0" fill="#9333ea"/>
<text x="858.0" y="657" font-family="system-ui, sans-serif" font-size="17" fill="#17243a" font-weight="600" text-anchor="middle">T1.1 · k=1,3</text>
<text x="858.0" y="680" font-family="system-ui, sans-serif" font-size="16" fill="#17243a" font-weight="400" text-anchor="middle">private sum = 2</text>
<text x="28" y="734" font-family="system-ui, sans-serif" font-size="17" fill="#17243a" font-weight="400" text-anchor="start">Join: 2 + 2 → C[0,j]=4; then the next j.</text>
<text x="508" y="734" font-family="system-ui, sans-serif" font-size="17" fill="#17243a" font-weight="400" text-anchor="start">Join: 2 + 2 → C[1,j]=4; then the next j.</text>
<text x="28" y="778" font-family="system-ui, sans-serif" font-size="17" fill="#526278" font-weight="400" text-anchor="start">A fresh k-team is created for each cell. Different row parents advance independently.</text>
<rect x="28" y="837" width="13" height="13" rx="2" fill="#2563eb"/>
<text x="49" y="850" font-family="system-ui, sans-serif" font-size="16" fill="#17243a" font-weight="400" text-anchor="start">T0.0</text>
<rect x="264" y="837" width="13" height="13" rx="2" fill="#c2410c"/>
<text x="285" y="850" font-family="system-ui, sans-serif" font-size="16" fill="#17243a" font-weight="400" text-anchor="start">T0.1</text>
<rect x="500" y="837" width="13" height="13" rx="2" fill="#0f766e"/>
<text x="521" y="850" font-family="system-ui, sans-serif" font-size="16" fill="#17243a" font-weight="400" text-anchor="start">T1.0</text>
<rect x="736" y="837" width="13" height="13" rx="2" fill="#9333ea"/>
<text x="757" y="850" font-family="system-ui, sans-serif" font-size="16" fill="#17243a" font-weight="400" text-anchor="start">T1.1</text>
<text x="28" y="896" font-family="system-ui, sans-serif" font-size="15" fill="#607086" font-weight="400" text-anchor="start">IDs are local team paths, not global thread IDs. Inner regions create new teams.</text>
</svg>
