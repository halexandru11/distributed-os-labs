<text x="548" y="324" font-family="system-ui, sans-serif" font-size="16" fill="#c2410c" font-weight="600" text-anchor="start">T1</text>
<text x="536" y="372" font-family="system-ui, sans-serif" font-size="16" fill="#17243a" font-weight="400" text-anchor="start">Each tile adds 1 with atomic update</text>
<text x="536" y="399" font-family="system-ui, sans-serif" font-size="16" fill="#17243a" font-weight="400" text-anchor="start">3 protected additions → C[0,0] = 3</text>
<defs><marker id="arrow-C3" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#9aa9bd"/></marker></defs>
<text x="28" y="457" font-family="system-ui, sans-serif" font-size="21" fill="#17243a" font-weight="600" text-anchor="start">Flatten the indices into one shared queue</text>
<text x="28" y="488" font-family="system-ui, sans-serif" font-size="20" fill="#17243a" font-weight="400" text-anchor="start">q = (i × 2 + j) × 3 + k</text>
<text x="28" y="518" font-family="system-ui, sans-serif" font-size="17" fill="#526278" font-weight="400" text-anchor="start">Each q is one product anywhere in C; k changes fastest.</text>
