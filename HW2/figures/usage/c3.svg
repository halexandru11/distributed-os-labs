<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900" role="img">
<title>C3 collapse_ijk — cell and product ownership</title>
<desc>Twelve products form one queue; fixed chunks of two make both workers contribute to every output cell. Colors and thread labels identify owners; the small strip in each output cell lists k-product owners left to right. Dynamic and guided allocation is illustrative.</desc>
<rect width="1000" height="900" rx="14" fill="#fff"/>
