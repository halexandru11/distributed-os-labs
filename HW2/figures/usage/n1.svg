<rect x="500" y="837" width="13" height="13" rx="2" fill="#0f766e"/>
<text x="521" y="850" font-family="system-ui, sans-serif" font-size="16" fill="#17243a" font-weight="400" text-anchor="start">T1.0</text>
<rect x="736" y="837" width="13" height="13" rx="2" fill="#9333ea"/>
<text x="757" y="850" font-family="system-ui, sans-serif" font-size="16" fill="#17243a" font-weight="400" text-anchor="start">T1.1</text>
<text x="28" y="896" font-family="system-ui, sans-serif" font-size="15" fill="#607086" font-weight="400" text-anchor="start">IDs are local team paths, not global thread IDs. Inner regions create new teams.</text>
