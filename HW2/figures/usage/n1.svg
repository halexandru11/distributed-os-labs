<text x="28" y="105" font-family="system-ui, sans-serif" font-size="20" fill="#17243a" font-weight="600" text-anchor="start">C: rows i, columns j</text>
<text x="28" y="130" font-family="system-ui, sans-serif" font-size="16" fill="#607086" font-weight="400" text-anchor="start">All values = 4. Each colored strip = k0 → k3.</text>
