<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900" role="img">
<title>N1 nested_ij — cell and product ownership</title>
<desc>Each outer row worker creates a column team. Leaf workers compute complete cells. Colors and thread labels identify owners; the small strip in each output cell lists k-product owners left to right. Dynamic and guided allocation is illustrative.</desc>
