<text x="28" y="738" font-family="system-ui, sans-serif" font-size="17" fill="#17243a" font-weight="400" text-anchor="start">Each leaf owns complete cells; it computes the full dot product and stores C.</text>
<text x="28" y="778" font-family="system-ui, sans-serif" font-size="17" fill="#526278" font-weight="400" text-anchor="start">Two levels: 2 row workers × 2 column workers. Inner teams join before returning.</text>
